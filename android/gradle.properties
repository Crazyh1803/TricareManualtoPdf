# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# NOTE: do not set org.gradle.java.home here. This file is committed, so a
# machine-specific path makes the project unbuildable everywhere else — it
# previously pinned a Windows JDK and broke every other machine, CI included.
# Gradle uses JAVA_HOME by default; to force a particular JDK for yourself,
# set org.gradle.java.home in your own ~/.gradle/gradle.properties instead.

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official
