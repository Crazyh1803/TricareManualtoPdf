name: Update TRICARE Manual Content

# ── Triggers ────────────────────────────────────────────────────────────────
on:
  schedule:
    # Every Monday at 06:00 UTC — after the weekend when DHA typically publishes changes
    - cron: '0 6 * * 1'

  workflow_dispatch:
    inputs:
      manual_code:
        description: 'Only update this manual (leave blank for all)'
        required: false
        default: ''
      force:
        description: 'Force re-fetch even if change number unchanged'
        type: boolean
        default: false

# ── Permissions ─────────────────────────────────────────────────────────────
permissions:
  contents: write   # needed to commit docs/data/ changes

# ── Job ─────────────────────────────────────────────────────────────────────
jobs:
  update:
    name: Fetch manual content
    runs-on: ubuntu-latest
    timeout-minutes: 120   # large manuals can take a while
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'   # opt into Node 24 ahead of June 2026 forced cutover

    steps:
      # 1. Check out the repo
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Seed docs/data/ from the web branch — main's own copy stopped being
      #    updated back in May 2026 (scraped content only ever gets pushed to
      #    web, see step 7). Without this the runner starts from that frozen
      #    snapshot, which caused two compounding bugs:
      #      a) the scraper re-seeded its "known change" from stale values, so
      #         detection could never progress; and
      #      b) step 7 copies this whole directory over web's, so any manual
      #         the scraper skipped as "up to date" had its live content reset
      #         to the May snapshot every single run (TPT5/TRT5/TST5 had not
      #         been genuinely re-fetched since then).
      #    Reading web's data into the runner fixes both. Nothing is pushed
      #    back to main — main's docs/data/ stays as-is.
      - name: Seed docs/data from web branch
        id: seed
        run: |
          git fetch origin web
          rm -rf docs/data
          git archive origin/web docs/data | tar -x

      # 3. Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      # 4. Install dependencies
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # 5. Install Playwright browser (needed for JS-rendered TOC pages)
      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      # 6. Run scraper
      - name: Fetch manual content
        # Step-level cap below the job's 120. Hitting a *step* timeout fails the
        # step and lets the commit step below still run; hitting the *job*
        # timeout cancels everything and publishes nothing.
        timeout-minutes: 110
        run: |
          CODE_ARG=""
          FORCE_ARG=""
          if [ -n "${{ github.event.inputs.manual_code }}" ]; then
            CODE_ARG="--code ${{ github.event.inputs.manual_code }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          # -u keeps stdout unbuffered. Python buffers stdout when it is a
          # pipe, so a job killed at the 2-hour cap flushes nothing: the
          # 2026-09-07 timeout logged two hours of complete silence, leaving
          # no way to tell where it had got stuck.
          python -u scripts/fetch_manuals.py $CODE_ARG $FORCE_ARG

      # 7. Commit updated data files to the web branch (where GitHub Pages serves from)
      #    always() so partial progress still gets published. The scraper writes
      #    each manual's files only after that manual has been fetched and passed
      #    its quality guards, so a run that fails or is cancelled part-way leaves
      #    completed manuals on disk intact — publishing them is strictly better
      #    than throwing the whole run away (which is what happened when the
      #    2026-09-07 run hit the 2-hour cap). The job still reports red, so a
      #    failure is not hidden. If nothing was scraped the diff is empty and
      #    this step no-ops.
      - name: Commit updated content to web branch
        # Guarded on the seed step: without a successful seed, docs/data is
        # main's frozen May-2026 snapshot, and publishing that would reset every
        # manual's live content — the exact clobbering bug step 2 exists to
        # prevent.
        if: always() && steps.seed.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage everything in docs/data/ so new files are detected too
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No changes — manuals are already up to date."
            exit 0
          fi

          # Back up the freshly-scraped data before switching branches
          cp -r docs/data /tmp/updated-data

          # Switch to the web branch (GitHub Pages source)
          # Use --force because the scraper modified docs/data/ in-place on
          # the main checkout; we've already copied the data to /tmp so it's
          # safe to discard those local changes and let checkout overwrite them.
          git fetch origin web
          git checkout --force web

          # Overlay updated data, removing anything no longer present
          rm -rf docs/data
          cp -r /tmp/updated-data docs/data

          git add docs/data/
          if git diff --cached --quiet; then
            echo "Data already up to date on web branch."
            exit 0
          fi

          git commit -m "chore: update manual content $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase origin web
          git push origin web
