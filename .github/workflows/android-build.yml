name: Build Android app

# The Android app cannot be compiled in the dev container (no Android SDK), so
# changes to it were previously only checked by eye. Runners ship the SDK, so
# this gives Kotlin changes a real compiler before they are relied on.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The project pins Gradle 8.2 in gradle/wrapper/gradle-wrapper.properties
      # but no gradlew script is committed, so a bare `gradle` picks up the
      # runner's 9.x — which Android Gradle Plugin 8.2.0 does not support.
      # Pin the version the project actually expects.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          # setup-gradle's cache save and cleanup run after the build and emit
          # a few hundred lines, which buries the compiler error that matters.
          cache-disabled: true

      - name: Assemble debug
        working-directory: android
        run: gradle --no-daemon --console=plain assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
